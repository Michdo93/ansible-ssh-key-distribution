---
- name: Authorize the key for each target account
  ansible.builtin.include_tasks: linux_authorize_user.yml
  loop: "{{ kd_users }}"
  loop_control:
    loop_var: kd_target

# Only this small record is read by the source host (never the whole hostvars).
- name: Remember connection data and host keys for the source host
  ansible.builtin.set_fact:
    kd_record:
      users: "{{ kd_users_done | default([]) }}"
      address: "{{ ansible_host | default(inventory_hostname) }}"
      port: "{{ ansible_port | default(22) }}"
      known_name: "{{ (ansible_host | default(inventory_hostname)) if (ansible_port | default(22) | int) == 22
                     else '[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ ansible_port }}"
      host_keys: >-
          {{ [('ssh-ed25519 ' ~ ansible_facts['ssh_host_key_ed25519_public']) if 'ssh_host_key_ed25519_public' in ansible_facts else '',
              ((ansible_facts['ssh_host_key_ecdsa_public_keytype'] | default('ecdsa-sha2-nistp256')) ~ ' ' ~ ansible_facts['ssh_host_key_ecdsa_public'])
                if 'ssh_host_key_ecdsa_public' in ansible_facts else '',
              ('ssh-rsa ' ~ ansible_facts['ssh_host_key_rsa_public']) if 'ssh_host_key_rsa_public' in ansible_facts else '']
             | select | list }}
