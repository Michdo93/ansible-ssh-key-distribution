---
# Requires the ansible.windows collection (ansible-galaxy collection install -r requirements.yml).
- name: Authorize the key for each target account
  ansible.builtin.include_tasks: windows_authorize_user.yml
  loop: "{{ kd_users }}"
  loop_control:
    loop_var: kd_target

- name: Read the SSH host keys (Windows OpenSSH)
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      Get-ChildItem (Join-Path $env:ProgramData 'ssh') -Filter 'ssh_host_*_key.pub' |
        ForEach-Object { ((Get-Content -LiteralPath $_.FullName -Raw).Trim() -split '\s+')[0..1] -join ' ' }
  register: kd_win

# Only this small record is read by the source host (never the whole hostvars).
- name: Remember connection data and host keys for the source host
  ansible.builtin.set_fact:
    kd_record:
      users: "{{ kd_users_done | default([]) }}"
      address: "{{ ansible_host | default(inventory_hostname) }}"
      port: "{{ ansible_port | default(22) }}"
      known_name: "{{ (ansible_host | default(inventory_hostname)) if (ansible_port | default(22) | int) == 22
                     else '[' ~ (ansible_host | default(inventory_hostname)) ~ ']:' ~ ansible_port }}"
      host_keys: >-
          {{ kd_win.output | select('string') | list }}
